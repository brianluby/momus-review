# Lint and test the shell scripts (scripts/rollout.sh and
# scripts/verify-release.sh against stub gh binaries) plus workflow and
# dependency gates.
name: scripts

on:
  pull_request:
    paths: ["scripts/**", "examples/**", "eval/**", "tests/*.cjs", "src/dashboard/public/**", ".github/workflows/**", "Cargo.lock", "action.yml"]
  push:
    branches: [main]
    paths: ["scripts/**", "examples/**", "eval/**", "tests/*.cjs", "src/dashboard/public/**", ".github/workflows/**", "Cargo.lock", "action.yml"]
  schedule:
    # Weekly RustSec sweep of the locked dependency set on main.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Test rollout.sh
        run: scripts/test-rollout.sh

      # Release verification failure modes (stubbed gh): tampered archive,
      # altered SBOM, missing bundle/target, manifest digest mismatch, and
      # the attestation policy flags handed to gh.
      - name: Test verify-release.sh
        run: scripts/test-verify-release.sh

      - name: Test installer and publication gates
        run: |
          python3 -B scripts/test-install-release.py
          python3 -B scripts/test-release-workflow.py
          python3 -B scripts/test-action-evidence.py

      - name: Test SBOM finalization and artifact handoff
        run: |
          python3 -m venv "$RUNNER_TEMP/sbom-tests"
          "$RUNNER_TEMP/sbom-tests/bin/pip" install --quiet jsonschema==4.25.0
          "$RUNNER_TEMP/sbom-tests/bin/python" -B scripts/test-sbom.py

      - name: Test dashboard evidence rendering
        run: node --test tests/dashboard-robustness.cjs

      - name: Install the pinned Rust toolchain for offline fixture controls
        run: rustup toolchain install --profile minimal

      - name: Validate offline product benchmarks and outcome collection
        run: |
          # Documentation probes compile from temporary directories outside
          # the repository pin. Use installed toolchain binaries directly so
          # rustup cannot select or download the runner's default toolchain.
          fixture_rust_bin="$(dirname "$(rustup which rustc)")"
          export PATH="$fixture_rust_bin:$PATH"
          rustc --version
          python3 -B eval/momus/evaluate.py validate
          python3 -B eval/momus/test_evaluate.py
          python3 -B eval/momus/test_materialize.py
          python3 -B eval/momus/reproduce.py --all
          python3 -B eval/outcomes/test_collect.py
          cargo test --locked --test product_fixtures

  macos-shell:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test verifier and installer with system Bash 3.2
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -s /bin/bash "$RUNNER_TEMP/system-bash/bash"
          export PATH="$RUNNER_TEMP/system-bash:$PATH"
          bash --version
          scripts/test-verify-release.sh
          python3 -B scripts/test-install-release.py
          python3 -B scripts/test-action-evidence.py

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (pinned)
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/actionlint"
          curl -fsSL --retry 3 -o "$t.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $t.tar.gz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$t.tar.gz" actionlint
          # job.workflow_repository/workflow_sha are newer contexts the
          # actionlint schema lags on (used by review.yml/scan.yml on main).
          "$t" -oneline -shellcheck= \
            -ignore 'property "workflow_(repository|sha)" is not defined'

  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - name: Install cargo-audit (pinned, locked)
        run: cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/tools"

      # PR and scheduled runs degrade to a warning on an advisory-database
      # outage so an upstream outage cannot block unrelated work; the
      # release workflow runs the same script in fail mode.
      - name: RustSec audit
        run: |
          export PATH="$RUNNER_TEMP/tools/bin:$PATH"
          scripts/audit.sh --advisory-db-outage warn
