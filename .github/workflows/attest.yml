# Momus attestation: freeze final-byte checksums and create the provenance
# and SBOM attestations, called by release.yml at a pinned commit SHA (the
# same pin as builder.yml). No caller inputs; the target allowlist lives
# here.
#
# This workflow's attest job holds the repository's only
# id-token/attestations grants and executes no repository code — artifact
# downloads, hashing, and the SHA-pinned attestation action. Because the
# build (which runs dependency build.rs scripts) lives in builder.yml with
# only contents: read, signing material is never reachable from the build.
#
# It runs only AFTER Apple signing has replaced the macOS archive, so
# attestations cover the final signed bytes.
#
# Because attestations are signed here, this file is the signer whose
# identity consumers pin (scripts/verify-release.sh --signer-workflow).
# Changes require the same review bar as the release workflow.
name: momus attest

on:
  workflow_call: {}

jobs:
  attest:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, aarch64-apple-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      APPLE_SIGNING_REF: brianluby/apple-signing/.github/workflows/sign-macos.yml@bac7bb3123e4a1b1d6f89fc928914a20f21386d6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: momus-${{ matrix.target }}
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: momus-${{ matrix.target }}-build
          path: meta

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.target == 'aarch64-apple-darwin'
        with:
          name: apple-notarization-momus-aarch64-apple-darwin
          path: notes

      # Freeze the final bytes: checksums are recomputed here from what will
      # be published, never carried over from pre-signing artifacts.
      - name: Freeze checksums
        run: |
          set -euo pipefail
          # Signing overwrites the archive artifact. The SBOM therefore
          # travels with build metadata, outside the signing boundary.
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          target = os.environ["TARGET"]
          sbom = pathlib.Path(f"meta/momus-{target}.cdx.json")
          metadata = json.loads(pathlib.Path("meta/metadata.json").read_text())
          if metadata["target"] != target or metadata["sbom"]["name"] != sbom.name:
              raise SystemExit("SBOM target does not match build metadata")
          data = sbom.read_bytes()
          if hashlib.sha256(data).hexdigest() != metadata["sbom"]["sha256"]:
              raise SystemExit("SBOM digest does not match build metadata")
          bom = json.loads(data)
          if not (bom.get("bomFormat") == "CycloneDX" and
                  bom.get("specVersion") == "1.5" and bom.get("serialNumber")):
              raise SystemExit("SBOM is not compatible with the pinned attestation action")
          shutil.copyfile(sbom, pathlib.Path("dist") / sbom.name)
          PY
          # Missing subjects must fail before the action's glob can silently
          # attest only the archive.
          test -s "dist/momus-$TARGET.tar.gz"
          test -s "dist/momus-$TARGET.cdx.json"
          cd dist
          shasum -a 256 "momus-$TARGET.tar.gz" > "momus-$TARGET.tar.gz.sha256"
          cat "momus-$TARGET.tar.gz.sha256"

      - name: Attest build provenance (archive + SBOM as subjects)
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # Explicit subjects, never automatic discovery.
          subject-path: |
            dist/momus-${{ matrix.target }}.tar.gz
            dist/momus-${{ matrix.target }}.cdx.json

      - name: "Attest the SBOM (subject: archive, predicate: CycloneDX)"
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/momus-${{ matrix.target }}.tar.gz
          sbom-path: dist/momus-${{ matrix.target }}.cdx.json

      - name: Collect bundles and the target manifest fragment
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" "dist/momus-$TARGET.provenance.bundle.json"
          cp "${{ steps.sbom.outputs.bundle-path }}" "dist/momus-$TARGET.sbom-attestation.bundle.json"
          python3 - <<'PY'
          import hashlib, json, os
          target = os.environ["TARGET"]
          def sha(name):
              return hashlib.sha256(open(f"dist/{name}", "rb").read()).hexdigest()
          fragment = json.load(open("meta/metadata.json"))
          archive = f"momus-{target}.tar.gz"
          sbom = f"momus-{target}.cdx.json"
          fragment["archive"].update({"sha256": sha(archive), "bytes": os.path.getsize(f"dist/{archive}")})
          fragment["sbom"]["sha256"] = sha(sbom)
          fragment["attestations"] = {
              "provenance_bundle": f"momus-{target}.provenance.bundle.json",
              "sbom_bundle": f"momus-{target}.sbom-attestation.bundle.json",
          }
          if target == "aarch64-apple-darwin":
              # Record the finalization transformation honestly: input
              # digest (unsigned), output digest (signed), signer workflow,
              # notarization evidence from Apple.
              submission = {}
              try:
                  submission = json.load(open("notes/submission.json"))
              except FileNotFoundError:
                  pass
              fragment["signing"] = {
                  "signer": os.environ["APPLE_SIGNING_REF"],
                  "input_sha256": fragment["archive"].pop("unsigned_sha256"),
                  "output_sha256": fragment["archive"]["sha256"],
                  "notarization": {"id": submission.get("id"), "status": submission.get("status")},
              }
          json.dump(fragment, open(f"dist/momus-{target}.fragment.json", "w"), indent=2)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: momus-${{ matrix.target }}-attested
          path: |
            dist/momus-${{ matrix.target }}.tar.gz
            dist/momus-${{ matrix.target }}.tar.gz.sha256
            dist/momus-${{ matrix.target }}.cdx.json
            dist/momus-${{ matrix.target }}.provenance.bundle.json
            dist/momus-${{ matrix.target }}.sbom-attestation.bundle.json
            dist/momus-${{ matrix.target }}.fragment.json
          if-no-files-found: error
