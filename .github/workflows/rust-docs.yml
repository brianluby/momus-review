name: rust-docs

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docs/**"
      - "README.md"
      - ".github/workflows/rust-docs.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docs/**"
      - "README.md"
      - ".github/workflows/rust-docs.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Run executable API examples
        run: cargo test --locked --doc
      - name: Check rustdoc links and code blocks
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps
