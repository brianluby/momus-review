# Prebuilt `momus` binaries. A `v*` tag builds every target, tests, and
# attaches `momus-<target>.tar.gz` (+ `.sha256`) to a GitHub release; the
# Action (`action.yml`) downloads those. `workflow_dispatch` builds the same
# archives as run artifacts without releasing anything.
name: release

on:
  push:
    # Release tags only (v1.2.3); the moving major tag (v0) is not a release.
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 builds link an older glibc, so they run on more hosts.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --bin momus

      - name: Package
        shell: bash
        run: |
          name="momus-$TARGET"
          mkdir -p "dist/$name"
          cp target/release/momus LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: momus-${{ matrix.target }}
          path: |
            dist/momus-${{ matrix.target }}.tar.gz
            dist/momus-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    # A tag push only: a workflow_dispatch run started on a tag ref is still
    # a build-only dry run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes --verify-tag

      # Callers pin the reusable workflow and the action to the major tag
      # (review.yml@v0), so each release moves it; v1.x would move v1.
      - name: Move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" \
              -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" --silent
          fi
          echo "$major -> $GITHUB_SHA"
